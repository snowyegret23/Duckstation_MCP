[project]
name = "duckstation-mcp"
version = "0.1.0"
description = "MCP server for DuckStation debugging, memory dump, and log inspection"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "psutil>=5.9",
]

[project.optional-dependencies]
xinput = [
    "vgamepad==0.1.0; platform_system == 'Windows'",
]

[project.scripts]
duckstation-mcp = "duckstation_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckstation_mcp"]
