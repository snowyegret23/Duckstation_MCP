[project]
name = "duckstation-mcp"
version = "0.1.0"
description = "MCP server for DuckStation debugging, memory dump, and log inspection"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "psutil>=5.9",
]

[project.scripts]
duckstation-mcp = "duckstation_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duckstation_mcp"]
